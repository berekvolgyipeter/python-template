[project]
name = "python-template"
version = "0.1.0"
description = "Python Template"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    "pytest-env>=1.0.0",
    "mypy>=2.0.0",
    "ruff>=0.16.0",
    "complexipy>=6.0.0",
    "ipdb>=0.13.0",
    "memory-profiler>=0.61.0",
    "line-profiler>=5.0.0",
    "rich>=15.0.0",
]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py314"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "RET",   # flake8-return
    "PTH",   # flake8-use-pathlib
    "ARG",   # flake8-unused-arguments
    "C90",   # mccabe
    "PL",    # pylint
    "S",     # flake8-bandit
    "DTZ",   # flake8-datetimez
    "ASYNC", # flake8-async
    "BLE",   # flake8-blind-except
    "TRY",   # tryceratops
    "T20",   # flake8-print
    "PT",    # flake8-pytest-style
    "LOG",   # flake8-logging
    "G",     # flake8-logging-format
    "PIE",   # flake8-pie
    "PERF",  # perflint
    "FURB",  # refurb
    "RUF",   # ruff-specific
    "PGH",   # pygrep-hooks — no blanket noqa / type: ignore
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",
    "PLR2004",
] # assert and magic values are the point in tests

# Limit function signature and body size
[tool.ruff.lint.pylint]
max-args = 6
max-positional-args = 3
max-statements = 30
max-branches = 10
max-returns = 5

# Limit cyclomatic complexity
[tool.ruff.lint.mccabe]
max-complexity = 10

# Limit cognitive complexity
[tool.complexipy]
paths = ["src", "tests"]
max-complexity-allowed = 10

[tool.mypy]
python_version = "3.14"
files = ["src", "tests"]
strict = true
warn_unreachable = true # not covered by strict
disable_error_code = ["import-untyped"]
enable_error_code = [
    "ignore-without-code", # bare "type: ignore" must name the code it silences
    "possibly-undefined",  # name may be unbound on some branch
    "redundant-expr",      # condition is always true/false
    "truthy-bool",         # non-bool object used in a boolean context
    "unused-awaitable",    # awaitable created but never awaited
]

# Tests stay type checked, but not at the cost of annotating every test and @patch mock arg
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false

# Scope coverage to the package
[tool.coverage.run]
source = ["src"]

# Environment variables set for every test run
[tool.pytest_env]
ENVIRONMENT = "test"
